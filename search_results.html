<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리서치 결과 - DONNA</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚖️</text></svg>">
    <script src="donna_db.js"></script>
    
    <style>
        /* 🌤️ 메인 화면과 통일된 클린 에어로 라이트 테마 */
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(180deg, #F4F8FB 0%, #E2EEF9 100%);
            color: #0F172A;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #93C5FD; border-radius: 10px; }
        
        /* 플로팅 헤더 */
        header {
            padding: 18px 30px;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(14, 165, 233, 0.2);
            border-radius: 24px;
            display: flex;
            align-items: center;
            gap: 35px;
            position: sticky;
            top: 15px;
            z-index: 1000;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.06);
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }
        .logo {
            color: transparent;
            background: linear-gradient(135deg, #0F172A, #0284C7);
            -webkit-background-clip: text;
            font-size: 1.8rem;
            font-weight: 900;
            text-decoration: none;
            letter-spacing: 4px;
        }
        
        .search-wrapper {
            flex: 1; max-width: 700px; display: flex; position: relative;
            background: #F8FAFC; border-radius: 16px;
            border: 1.5px solid rgba(14, 165, 233, 0.35); transition: 0.3s;
        }
        .search-wrapper:focus-within {
            background: #FFFFFF; border-color: #0284C7;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.15);
        }
        .search-wrapper input {
            flex: 1; padding: 14px 22px; font-size: 1.05rem; border: none;
            background: transparent; color: #0F172A; outline: none; letter-spacing: 0.5px;
        }
        .search-wrapper button {
            padding: 0 32px; border: none; border-radius: 0 14px 14px 0;
            background: linear-gradient(135deg, #0284C7, #0EA5E9);
            color: #FFFFFF; font-size: 1rem; font-weight: 800; cursor: pointer; transition: 0.3s;
        }
        .search-wrapper button:hover { background: #0369A1; }
        
        .autocomplete-list {
            position: absolute; top: calc(100% + 8px); left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(15px);
            border: 1px solid #38BDF8; border-radius: 16px; z-index: 1001;
            max-height: 280px; overflow-y: auto; display: none;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.12);
        }
        .autocomplete-item {
            padding: 14px 22px; cursor: pointer; color: #1E293B; font-size: 1rem;
            border-bottom: 1px solid #F1F5F9; display: flex; align-items: center; gap: 10px;
        }
        .autocomplete-item:hover { background: #F0F9FF; color: #0284C7; }

        /* 메인 컨테이너 */
        .main-container { display: flex; flex: 1; gap: 25px; max-width: 1400px; margin: 0 auto; width: 100%; }
        
        /* 좌측 필터 사이드바 */
        .sidebar {
            width: 270px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            padding: 30px 24px;
            border-radius: 24px;
            border: 1px solid rgba(14, 165, 233, 0.2);
            height: fit-content;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.05);
            position: sticky;
            top: 110px;
        }
        .filter-title {
            font-size: 1.1rem; font-weight: 800; color: #0284C7;
            margin-bottom: 20px; border-bottom: 1px solid #E2E8F0;
            padding-bottom: 12px; letter-spacing: 0.5px;
        }
        .filter-item {
            display: flex; align-items: center; gap: 10px; margin-bottom: 15px;
            color: #334155; font-size: 1rem; font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .filter-item:hover { color: #0284C7; transform: translateX(4px); }
        
        /* 우측 결과 영역 */
        .results-area { flex: 1; display: flex; flex-direction: column; gap: 20px; padding-bottom: 40px; }
        
        /* 대한민국 API 전용 카드 */
        .api-viewer {
            background: #FFFFFF;
            border: 1.5px solid #38BDF8;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 12px 30px rgba(2, 132, 199, 0.08);
            position: relative;
            overflow: hidden;
        }
        .api-viewer::before {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, #0284C7, #38BDF8);
        }
        .api-header {
            border-bottom: 1px solid #E2E8F0; padding-bottom: 15px; margin-bottom: 18px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .api-title { font-size: 1.25rem; font-weight: 800; color: #0369A1; display: flex; align-items: center; gap: 10px; }
        .api-content {
            background: #F8FAFC; padding: 22px; border-radius: 16px;
            border: 1px solid #E2E8F0; max-height: 380px; overflow-y: auto;
        }
        .law-item { margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid #E2E8F0; }
        .law-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .law-title { font-size: 1.1rem; font-weight: 700; color: #0F172A; margin-bottom: 8px; display: block; text-decoration: none; }
        .law-title:hover { color: #0284C7; text-decoration: underline; }
        .law-dept { font-size: 0.85rem; color: #475569; background: #E0F2FE; padding: 5px 10px; border-radius: 6px; font-weight: 600; }
        
        /* 일반 리서치 결과 카드 */
        .result-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 24px;
            border: 1px solid rgba(14, 165, 233, 0.18);
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(15, 23, 42, 0.04);
        }
        .result-card:hover {
            transform: translateY(-4px);
            border-color: #38BDF8;
            box-shadow: 0 15px 35px rgba(2, 132, 199, 0.12);
        }
        .result-title { font-size: 1.25rem; font-weight: 800; color: #0F172A; margin-bottom: 14px; }
        .badge {
            padding: 5px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 700;
            margin-right: 10px; color: #0369A1; background: #E0F2FE; border: 1px solid #BAE6FD;
        }
        .result-desc { font-size: 1rem; color: #475569; line-height: 1.6; margin: 16px 0 20px 0; }
        
        .link-btn {
            display: inline-block; padding: 11px 24px;
            background: #F0F9FF; border: 1.5px solid #0284C7; color: #0284C7;
            text-decoration: none; border-radius: 12px; font-size: 0.95rem; font-weight: 700; transition: 0.25s;
        }
        .link-btn:hover { background: #0284C7; color: #FFFFFF; box-shadow: 0 6px 18px rgba(2, 132, 199, 0.25); }
        .fallback-btn {
            display: inline-block; padding: 12px 28px;
            background: linear-gradient(135deg, #0284C7, #0EA5E9); color: #FFFFFF;
            text-decoration: none; border-radius: 12px; font-weight: 700; transition: 0.3s; margin-top: 12px;
        }
        .fallback-btn:hover { background: #0369A1; transform: translateY(-2px); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">DONNA</a>
        <div class="search-wrapper">
            <input type="text" id="resultSearchInput" autocomplete="off" onkeypress="if(event.key === 'Enter') performSearch()">
            <button onclick="performSearch()">리서치</button>
            <div id="autocompleteList" class="autocomplete-list"></div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="filter-title">Data Source Filter</div>
            <label class="filter-item"><input type="checkbox" class="country-filter" value="KR" checked> 대한민국 (API 연동)</label>
            <label class="filter-item"><input type="checkbox" class="country-filter" value="US" checked> 미국 (US)</label>
            <label class="filter-item"><input type="checkbox" class="country-filter" value="EU" checked> 유럽연합 (EU)</label>
            <label class="filter-item"><input type="checkbox" class="country-filter" value="CN_JP" checked> 중국 & 일본</label>
            <label class="filter-item"><input type="checkbox" class="country-filter" value="ICJ" checked> 국제재판소</label>
            <label class="filter-item"><input type="checkbox" class="country-filter" value="UN" checked> 국제기구 (UN)</label>
            <label class="filter-item"><input type="checkbox" class="country-filter" value="ACADEMIC" checked> 학술 논문</label>
        </aside>

        <main class="results-area" id="resultsArea">
            <div id="krApiSection" class="api-viewer" style="display: none;">
                <div class="api-header">
                    <div class="api-title">🇰🇷 대한민국 국가법령 다이렉트 브리핑</div>
                    <span style="font-size: 0.85rem; color: #64748B;">Source: 법제처 OpenAPI</span>
                </div>
                <div id="krApiContent" class="api-content"></div>
            </div>
            <div id="otherResultsArea"></div>
        </main>
    </div>

    <script>
        // 🚨 중요: 법제처 오픈 API 아이디 입력
        const MOLEG_API_KEY = "ohsm1023@gmail.com"; 
        
        let allResults = [];
        let currentQuery = "";

        const searchInput = document.getElementById('resultSearchInput');
        const autocompleteList = document.getElementById('autocompleteList');

        if (typeof legalKeywords !== 'undefined') {
            searchInput.addEventListener('input', function() {
                const val = this.value.toLowerCase();
                autocompleteList.innerHTML = ''; 
                if (!val) { autocompleteList.style.display = 'none'; return; }
                
                const filtered = legalKeywords.filter(k => k.toLowerCase().includes(val));
                if (filtered.length > 0) {
                    autocompleteList.style.display = 'block';
                    filtered.forEach(k => {
                        const d = document.createElement('div');
                        d.className = 'autocomplete-item';
                        const regex = new RegExp("(" + val + ")", "gi");
                        const highlightedText = k.replace(regex, "<strong style='color:#0284C7;'>$1</strong>");
                        d.innerHTML = `<span style="opacity:0.7;">🔍</span> <span>${highlightedText}</span>`;
                        d.onclick = () => { 
                            searchInput.value = k; autocompleteList.style.display = 'none'; performSearch();
                        };
                        autocompleteList.appendChild(d);
                    });
                } else { autocompleteList.style.display = 'none'; }
            });
        }

        document.addEventListener('click', (e) => { 
            if (e.target !== searchInput) autocompleteList.style.display = 'none'; 
        });

        window.onload = function() {
            const query = new URLSearchParams(window.location.search).get('q');
            if (query) {
                currentQuery = query;
                searchInput.value = query;

                const englishWords = query.match(/[A-Za-z0-9]+/g);
                const englishOnlyQuery = englishWords ? englishWords.join(" ") : query;

                const encodedEnglishQ = encodeURIComponent(englishOnlyQuery);
                const exactEnglishQ = encodeURIComponent(`"${englishOnlyQuery}"`);

                allResults = [
                    { title: `'${query}' 관련 미국 연방 정부 및 행정 규제 리서치`, country: "US", type: "연방규제/가이드라인", desc: `미국 연방 정부 도메인(.gov) 내의 '${englishOnlyQuery}' 관련 자료를 타겟 검색합니다. (한/영 혼합 검색 시 영어 키워드 자동 추출)`, link: `https://www.google.com/search?q=site:usa.gov+OR+site:gov+${exactEnglishQ}` },
                    { title: `'${query}' 관련 미국 연방법 및 50개 주법 통합 리서치`, country: "US", type: "성문법/주법", desc: `Cornell LII 및 Justia 내의 '${englishOnlyQuery}' 관련 연방법전 및 개별 주법을 검색합니다.`, link: `https://www.google.com/search?q=site:law.cornell.edu+OR+site:justia.com+${exactEnglishQ}` },
                    { title: `'${query}' 관련 미국 연방 및 주 대법원 판례 (CourtListener)`, country: "US", type: "미국 판례 전용", desc: `CourtListener 데이터베이스 내에서 '${englishOnlyQuery}' 관련 판결문을 검색합니다.`, link: `https://www.courtlistener.com/?q=${encodedEnglishQ}` },
                    { title: `'${query}' 관련 유럽연합(EU) 관보 및 EUR-Lex 자료`, country: "EU", type: "지침/규정", desc: `유럽연합 EUR-Lex 내의 '${englishOnlyQuery}' 관련 규정 및 지침을 검색합니다.`, link: `https://eur-lex.europa.eu/search.html?scope=EURLEX&text=${encodedEnglishQ}&lang=en&type=quick` },
                    { title: `'${query}' 관련 중국 PKULAW 및 일본 e-Gov 공개 자료`, country: "CN_JP", type: "해외법령", desc: `중국 PKULAW 및 일본 총무성 e-Gov 내의 '${englishOnlyQuery}' 관련 공개 자료를 검색합니다.`, link: `https://www.google.com/search?q=site:elaws.e-gov.go.jp+OR+site:pkulaw.com+${exactEnglishQ}` },
                    { title: `'${query}' 관련 국제재판소 (ICJ / ICC) 주요 판례 및 원문`, country: "ICJ", type: "국제판례", desc: `ICJ 공식 사이트 내의 '${englishOnlyQuery}' 관련 판결문을 검색합니다.`, link: `https://www.google.com/search?q=site:icj-cij.org+${exactEnglishQ}` },
                    { title: `'${query}' 관련 UN 공식 문서 및 국제 협약 원문`, country: "UN", type: "국제기구", desc: `유엔 공식 문서 시스템 및 UN 도메인 내의 '${englishOnlyQuery}' 관련 공식 문서를 검색합니다.`, link: `https://www.google.com/search?q=site:un.org+OR+site:documents.un.org+${exactEnglishQ}` },
                    { title: `'${query}' 관련 주요 학술 논문 (Google Scholar)`, country: "ACADEMIC", type: "학술논문", desc: `구글 스칼라 내의 '${englishOnlyQuery}' 관련 학술 논문을 검색합니다.`, link: `https://scholar.google.co.kr/scholar?q=${encodedEnglishQ}` }
                ];
                renderResults();
            }
        };

        function renderResults() {
            const activeCountries = Array.from(document.querySelectorAll('.country-filter:checked')).map(cb => cb.value);
            const apiSection = document.getElementById('krApiSection');
            const apiContent = document.getElementById('krApiContent');
            
            if (activeCountries.includes("KR")) {
                apiSection.style.display = "block";
                const fallbackLink = `https://www.law.go.kr/lsSc.do?section=&menuId=1&subMenuId=15&tabMenuId=81&query=${encodeURIComponent(currentQuery)}`;
                const showFallbackUI = () => {
                    apiContent.innerHTML = `<div style="padding:15px; text-align:center;"><div style="color:#0284C7; font-size:1.15rem; margin-bottom:10px; font-weight:800;">🛡️ 정부 방화벽 우회: 공식 데이터망 연결 완료</div><div style="color:#475569; font-size:0.95rem; margin-bottom:18px; line-height:1.6;">법제처 오픈 API 서버가 외부망 접근을 제한할 경우 가장 안정적인 직통 경로로 즉시 연결합니다.</div><a href="${fallbackLink}" target="_blank" class="fallback-btn">국가법령정보센터 원문 열람 ↗</a></div>`;
                };

                if (MOLEG_API_KEY === "여기에_아이디를_입력하세요") {
                    apiContent.innerHTML = `<div style="text-align:center; padding:30px 20px;"><span style="font-size:1.8rem; display:block; margin-bottom:10px;">⚠️</span><span style="display:block; font-size:1.1rem; color:#0F172A; margin-bottom:6px; font-weight:bold;">인증키 입력 대기 중</span><span style="font-size:0.9rem; color:#64748B;">코드 내 MOLEG_API_KEY 변수에 법제처 로그인 ID를 입력하거나 아래 버튼으로 바로 이동하세요.</span><br><a href="${fallbackLink}" target="_blank" class="fallback-btn">국가법령정보센터 직통 열람 ↗</a></div>`;
                } else {
                    apiContent.innerHTML = `<div style="text-align:center; padding:30px 20px;"><span style="font-size:1.8rem; display:block; margin-bottom:10px;">📡</span><span style="display:block; font-size:1.1rem; color:#0284C7; font-weight:bold;">법제처 공공데이터 서버와 실시간 통신 중...</span></div>`;
                    const timestamp = new Date().getTime();
                    const apiUrl = `https://www.law.go.kr/DRF/lawSearch.do?OC=${MOLEG_API_KEY}&target=law&type=XML&query=${encodeURIComponent(currentQuery)}&_cb=${timestamp}`;
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`;
                    
                    fetch(proxyUrl)
                        .then(response => { if (!response.ok) throw new Error("방화벽 차단됨"); return response.text(); })
                        .then(str => {
                            const xmlDoc = new window.DOMParser().parseFromString(str, "text/xml");
                            if (xmlDoc.getElementsByTagName("parsererror").length > 0 || xmlDoc.querySelector("message, errMsg, Error") || xmlDoc.querySelectorAll("law").length === 0) throw new Error("유효한 데이터 없음");
                            
                            const laws = xmlDoc.querySelectorAll("law");
                            let html = "";
                            for (let i = 0; i < Math.min(laws.length, 5); i++) {
                                const lawName = laws[i].querySelector("법령명한글")?.textContent || "이름 없음";
                                const lawLink = laws[i].querySelector("법령상세링크")?.textContent || "";
                                const dept = laws[i].querySelector("소관부처명")?.textContent || "부처 미상";
                                html += `<div class="law-item"><a href="https://www.law.go.kr${lawLink}" target="_blank" class="law-title">📄 ${lawName}</a><span class="law-dept">소관부처: ${dept}</span></div>`;
                            }
                            apiContent.innerHTML = html;
                        })
                        .catch(() => { showFallbackUI(); });
                }
            } else {
                apiSection.style.display = "none";
            }

            const otherResultsArea = document.getElementById('otherResultsArea');
            otherResultsArea.innerHTML = "";
            allResults.filter(r => activeCountries.includes(r.country)).forEach(result => {
                const card = document.createElement('div');
                card.className = 'result-card';
                const nameMap = { "US":"미국 (US)", "EU":"유럽연합", "CN_JP":"중국 & 일본", "ICJ":"국제재판소", "UN":"국제기구", "ACADEMIC":"학술 논문" };
                const badgeName = nameMap[result.country] || result.country;
                card.innerHTML = `<div class="result-title">${result.title}</div><div style="margin-bottom:14px;"><span class="badge">${badgeName}</span><span style="color:#64748B; font-size:0.9rem; font-weight:600;">${result.type}</span></div><div class="result-desc">${result.desc}</div><a href="${result.link}" target="_blank" class="link-btn">원문 자료 보기 ↗</a>`;
                otherResultsArea.appendChild(card);
            });
        }

        document.querySelectorAll('.country-filter').forEach(cb => cb.addEventListener('change', renderResults));
        function performSearch() { const q = searchInput.value; if (q.trim()) window.location.href = `search_results.html?q=${encodeURIComponent(q)}`; }
    </script>
</body>
</html>
